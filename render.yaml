services:
  - type: web
    name: pickinggeek002
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: rm -rf backend/frontend_dist backend/staticfiles && pip install -r requirements.txt && cd frontend && npm ci && npm run build && cd .. && python backend/manage.py collectstatic --no-input --clear
    startCommand: python backend/manage.py migrate && (python backend/manage.py createsuperuser --noinput || true) && python backend/start_services.py
    healthCheckPath: /health/
    envVars:
      - key: BILLING_FRONTEND_URL
        value: https://pickinggeek002.onrender.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://pickinggeek002.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pickinggeek002.onrender.com
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1
      - key: JOB_WEBHOOK_SECRET
        generateValue: true
